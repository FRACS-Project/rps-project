[defaults]
# Inventory used when you don't pass -i. It's dev, so forgetting -i never touches prod.
# Relative paths in this file are resolved from this file's folder.
inventory = inventories/dev

# Extra place to look for roles. Without it, Ansible only checks playbooks/roles/.
roles_path = roles

# File that holds the vault password: outside the repo, chmod 600.
vault_password_file = ~/.ansible/rps_vault_pass

# Use the target's Python without printing a warning about which one was chosen.
interpreter_python = auto_silent

# Print task results as readable YAML instead of a single JSON line.
callback_result_format = yaml
