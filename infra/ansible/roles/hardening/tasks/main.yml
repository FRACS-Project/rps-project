---
- name: ufw installation
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: hardening_ufw_enabled

- name: SSH keys only, no root login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh

- name: Allow SSH from the allowed network
  community.general.ufw:
    rule: allow
    to: "{{ hardening_ssh_allowed_to }}"
    port: "{{ hardening_ssh_port }}"
    proto: tcp
    from_ip: "{{ hardening_ssh_allowed_from }}"
  when: hardening_ufw_enabled

- name: Allow SSH for tailscale
  community.general.ufw:
    rule: allow
    if_in: tailscale0
    port: "{{ hardening_ssh_port }}"
  when: hardening_ufw_enabled

- name: Enable ufw, deny other incoming traffic
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny
  when: hardening_ufw_enabled
