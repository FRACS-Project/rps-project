---
- name: Make sure cron is installed
  ansible.builtin.apt:
    name: cron
    state: present
    cache_valid_time: 3600

- name: Create the backup folder
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the backup script
  ansible.builtin.template:
    src: rps-backup.sh.j2
    dest: "{{ backup_script_path }}"
    owner: root
    group: root
    mode: "0750"

- name: Run the backup every night
  ansible.builtin.cron:
    name: "{{ backup_name }}"
    cron_file: "{{ backup_name }}"
    user: root
    hour: "{{ backup_hour }}"
    minute: "{{ backup_minute }}"
    job: "{{ backup_script_path }} 2>&1 | logger -t {{ backup_name }}"
