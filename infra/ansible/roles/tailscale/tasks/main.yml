- name: Install what the repository module needs
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add the Tailscale repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: "{{ tailscale_repo_url }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    architectures: "{{ tailscale_arch }}"
    signed_by: "{{ tailscale_key_url }}"
  register: tailscale_repo

- name: Refresh the package list when the repository is new
  ansible.builtin.apt:
    update_cache: true
  when: tailscale_repo.changed

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Start Tailscale now and at boot
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true